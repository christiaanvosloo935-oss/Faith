name: Keep Supabase awake

# Free Supabase projects pause after 7 days without activity. This makes one
# small request a day so the project stays awake even if nobody opens the app.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/keep-awake.mjs
